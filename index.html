       <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FPL Monthly Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container py-5">

    <div class="hero">

        <h1>⚽ Fantasy Premier League</h1>

        <h2 id="league-name">Loading...</h2>

        <p id="updated"></p>

    </div>

    <div id="month-buttons" class="month-buttons"></div>

    <div class="podium-section">

        <h3>🏆 Manager of the Month</h3>

        <div class="podium">
  
            <div class="podium-card first" id="first-place"></div>
               
            <div class="podium-card second" id="second-place"></div>

            <div class="podium-card third" id="third-place"></div>

        </div>

    </div>

    <div class="glass-card">

        <h3>Monthly Leaderboard</h3>

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                <tr>

                    <th>Rank</th>

                    <th>Manager</th>

                    <th>Team</th>

                    <th>Points</th>

                </tr>

                </thead>

                <tbody id="monthly-table">

                </tbody>

            </table>

        </div>

    </div>

    <br>

    <div class="glass-card">

        <h3>Overall League Standings</h3>

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                <tr>

                    <th>Rank</th>

                    <th>Manager</th>

                    <th>Team</th>

                    <th>Total</th>

                </tr>

                </thead>

                <tbody id="overall-table">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
